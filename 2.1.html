<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ramo de girasoles y tulipanes</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: linear-gradient(145deg, #1e2b2c 0%, #2e3f3e 100%);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: 'Segoe UI', 'Quicksand', system-ui, sans-serif;
      padding: 16px;
    }

    .card {
      background: #fef9e8;
      border-radius: 48px 48px 32px 32px;
      padding: 32px 28px 28px 28px;
      max-width: 820px;
      width: 100%;
      box-shadow: 0 25px 40px rgba(0, 0, 0, 0.5), 0 0 0 2px #f0d9b0 inset;
      transition: all 0.2s;
    }

    .ramo-container {
      display: flex;
      justify-content: center;
      align-items: flex-end;
      margin-bottom: 10px;
      filter: drop-shadow(0 12px 10px rgba(0, 0, 0, 0.2));
    }

    svg {
      width: 100%;
      height: auto;
      max-width: 680px;
      display: block;
      margin: 0 auto;
      border-radius: 24px;
    }

    .mensaje {
      text-align: center;
      margin-top: 12px;
      padding: 18px 16px 14px 16px;
      background: #fff9ef;
      border-radius: 60px 60px 30px 30px;
      box-shadow: 0 4px 0 #d9b382, 0 12px 24px -8px rgba(80, 50, 20, 0.3);
      border: 1px solid #f5e3c1;
    }

    .mensaje p {
      font-size: 1.5rem;
      font-weight: 600;
      color: #6b4f2b;
      letter-spacing: 0.5px;
      line-height: 1.4;
      text-shadow: 1px 1px 0 #fff6e0;
      font-family: 'Georgia', 'Times New Roman', serif;
      font-style: italic;
      margin-bottom: 6px;
    }

    .mensaje small {
      display: block;
      font-size: 1rem;
      color: #b38b5b;
      font-weight: 400;
      letter-spacing: 2px;
      font-family: 'Quicksand', sans-serif;
      text-transform: uppercase;
      border-top: 1px dashed #e7cfae;
      padding-top: 8px;
      margin-top: 6px;
    }

    /* Pequeña animación flotante para las flores */
    .flor-animada {
      animation: flotar 4s ease-in-out infinite;
    }

    @keyframes flotar {
      0% { transform: translateY(0px); }
      50% { transform: translateY(-4px); }
      100% { transform: translateY(0px); }
    }

    .tallo-hoja {
      transition: transform 0.3s;
    }

    /* Sombra suave */
    .sombra-ramo {
      filter: drop-shadow(0 8px 12px rgba(0, 0, 0, 0.25));
    }
  </style>
</head>
